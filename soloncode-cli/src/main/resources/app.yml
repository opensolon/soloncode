server.port: 4808

server.request:
  maxBodySize: 10mb
  maxFileSize: 10mb

server.http:
  coreThreads: 2
  maxThreads: 16

solon.task:
  execution:
    pool:
      size: 8
  scheduling:
    pool:
      size: 4

solon.app:
  name: "soloncode"
  title: "SolonCode"

solon.logging.appender:
  console:
    enable: false
  file:
    enable: false
    level: INFO
    name: "${user.home}/.soloncode/workspaces/${soloncode.wskey}/logs/${solon.app.name}"
    extension: ".log"
    maxFileSize: "10 MB"
    maxHistory: "7" #单位：天
    totalSizeCap: "200 MB"


soloncode:
  tools: "*,read,edit,bash"  # 仅公域工具 + 文件读写
  workDir: "work" # 工作区目录
  maxSteps: 30 # ReAct 最大循环步数
  maxStepsAutoExtensible: true #最大步数自动续航（由 LLM 反思控制）
  uiType: new

  sessionWindowSize: 8 # 会话历史窗口大小（即，新指令时使用几条历史消息）

  summaryWindowSize: 12 # 触发摘要压缩的消息条数阈值（即，工作上下文压缩时留几条消息不压缩）
  summaryWindowToken: 15000 # 触发摘要压缩的内容长度阈值（即，工作上下文压缩时留多长内容不压缩）

  sandboxMode: true # 消盒模式，启用时禁止访问绝对路径
  thinkPrinted: true # 内心思考，是否打印

  hitlEnabled: false # 是否启用人工审核危险操作，和 maxSteps 动态继步
  subagentEnabled: true # 是否启用子代理模式
  browserEnabled: true # 是否启用浏览器功能（比如去淘宝买东西）

  cliEnabled: true # 是否启用控制台
  cliPrintSimplified: true

  webEnabled: true # 是否启用 WebApi
  webEndpoint: "/cli"

  acpEnabled: false # 是否启用 Acp 协议（一些支持 Acp 的 IDE 可以连接）
  acpTransport: "websocket" # "stdio" or "websocket"
  acpEndpoint: "/acp"

  wsEnabled: true

  modelRetries: 3
