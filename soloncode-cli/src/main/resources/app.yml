#      timeout: "120s"
#      userAgent: "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; SolonCode/2.0; +https://solon.noear.org/)"

solon:
  logging:
    logger:
      "org.eclipse.jetty":
        level: WARN
      "io.modelcontextprotocol":
        level: INFO
