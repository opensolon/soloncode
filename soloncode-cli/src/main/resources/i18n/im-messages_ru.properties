# Сообщения SolonCode IM (русский)
im.accepted=Понял, начинаю прямо сейчас
im.longRunning=Я всё ещё работаю. Пожалуйста, подождите ещё немного
im.rejected=Это сообщение не попало в очередь, поэтому я его не получил. Отправьте его позже ещё раз. Чтобы остановить текущую задачу, отправьте /interrupt
im.hint.unbound=Сессия ещё не привязана. Отсканируйте QR-код на веб-странице, чтобы привязать её и общаться здесь
im.hint.botTaken=Этот бот уже привязан к другому диалогу. Чтобы привязать его к текущему, сначала отвяжите его в веб-интерфейсе, а затем отсканируйте QR-код заново.
im.hint.nonText=Пока я понимаю только текст. Отправьте текстовое сообщение
im.hint.steer=Чтобы дополнить или изменить текущую задачу, отправьте /steer <текст>
im.steered=Понял, добавил в текущую задачу. Это отразится в этом ответе.
im.hint.interrupt=Чтобы остановить текущую задачу, отправьте /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Понял, новая задача добавлена в очередь. Перед вами ещё {1} задач; я займусь вашей после них. {0}
im.queued.immediate=Понял, новая задача добавлена в очередь. Она начнётся после завершения текущей задачи. {0}
