# SolonCode IM বার্তা (বাংলা)
im.accepted=বুঝেছি, এখনই শুরু করছি
im.longRunning=এখনও কাজ চলছে, অনুগ্রহ করে আর একটু অপেক্ষা করুন
im.rejected=বার্তাটি কিউতে যোগ হয়নি, তাই আমি এটি পাইনি। পরে আবার পাঠান। বর্তমান কাজ থামাতে /interrupt পাঠান
im.hint.unbound=এখনও কোনো সেশন যুক্ত নেই। ওয়েব পৃষ্ঠায় QR কোড স্ক্যান করে যুক্ত করুন, তারপর এখানে কথা বলতে পারবেন
im.hint.nonText=এই মুহূর্তে আমি শুধু লেখা পড়তে পারি। একটি টেক্সট বার্তা পাঠান
im.hint.steer=বর্তমান কাজে যোগ বা পরিবর্তন করতে /steer <লেখা> পাঠান
im.hint.interrupt=বর্তমান কাজ থামাতে /interrupt পাঠান
im.hint.busyCommand={0}; {1}
im.queued.behind=বুঝেছি, নতুন কাজ হিসেবে কিউতে যোগ হয়েছে। আপনার আগে {1}টি কাজ আছে; সেগুলো শেষ হলে আপনার পালা। {0}
im.queued.immediate=বুঝেছি, নতুন কাজ হিসেবে কিউতে যোগ হয়েছে। বর্তমান কাজ শেষ হলে শুরু হবে। {0}
