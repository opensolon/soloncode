# Thông báo IM SolonCode (tiếng Việt)
im.accepted=Đã rõ, tôi bắt đầu ngay
im.longRunning=Tôi vẫn đang xử lý, vui lòng đợi thêm một chút
im.rejected=Tin nhắn này chưa được xếp hàng nên tôi chưa nhận được. Vui lòng gửi lại sau. Để dừng tác vụ hiện tại, hãy gửi /interrupt
im.hint.unbound=Chưa có phiên nào được liên kết. Hãy quét mã QR trên trang Web để liên kết, sau đó bạn có thể trò chuyện với tôi tại đây
im.hint.botTaken=Bot này đã được liên kết với một cuộc trò chuyện khác. Để liên kết với cuộc trò chuyện này, vui lòng hủy liên kết trên Web trước, rồi quét lại mã QR.
im.hint.nonText=Hiện tại tôi chỉ đọc được văn bản. Vui lòng gửi tin nhắn dạng văn bản
im.hint.steer=Để bổ sung hoặc điều chỉnh tác vụ hiện tại, hãy gửi /steer <nội dung>
im.steered=Đã hiểu, đã chèn vào tác vụ hiện tại. Nó sẽ thể hiện trong phản hồi này.
im.hint.interrupt=Để dừng tác vụ hiện tại, hãy gửi /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Đã rõ, đã xếp thành tác vụ mới. Còn {1} tác vụ phía trước; đến lượt bạn sau khi chúng hoàn tất. {0}
im.queued.immediate=Đã rõ, đã xếp thành tác vụ mới. Tác vụ sẽ bắt đầu ngay khi tác vụ hiện tại hoàn tất. {0}
