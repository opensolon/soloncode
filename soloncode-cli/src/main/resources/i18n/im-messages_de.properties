# SolonCode IM-Nachrichten (Deutsch)
im.accepted=Verstanden, ich beginne sofort
im.longRunning=Ich arbeite noch daran, bitte warten Sie einen Moment
im.rejected=Diese Nachricht wurde nicht eingereiht und nicht empfangen. Bitte senden Sie sie später erneut. Zum Stoppen der aktuellen Aufgabe senden Sie /interrupt
im.hint.unbound=Noch keine Sitzung gebunden. Scannen Sie den QR-Code auf der Web-Seite, um die Sitzung zu binden und hier zu chatten.
im.hint.nonText=Ich kann derzeit nur Text lesen. Bitte senden Sie eine Textnachricht.
im.hint.steer=Zum Ergänzen oder Ändern der aktuellen Aufgabe senden Sie /steer <Text>
im.hint.interrupt=Zum Stoppen der aktuellen Aufgabe senden Sie /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Verstanden, als neue Aufgabe eingereiht. {1} Aufgabe(n) vor Ihnen; danach sind Sie an der Reihe. {0}
im.queued.immediate=Verstanden, als neue Aufgabe eingereiht. Sie startet, sobald die aktuelle Aufgabe beendet ist. {0}
