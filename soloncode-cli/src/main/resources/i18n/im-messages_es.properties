# Mensajes IM de SolonCode (español)
im.accepted=Entendido, comienzo ahora mismo
im.longRunning=Todavía estoy trabajando, espera un poco más
im.rejected=Este mensaje no se pudo poner en cola y no lo recibí. Envíalo de nuevo más tarde. Para detener la tarea actual, envía /interrupt
im.hint.unbound=Aún no hay una sesión vinculada. Escanea el código QR en la web para vincularla y chatear conmigo aquí.
im.hint.botTaken=Este bot ya está vinculado a otra conversación. Para vincularlo a esta, desvincúlalo primero en la Web y vuelve a escanear el código QR.
im.hint.nonText=Por ahora solo puedo leer texto. Envíame un mensaje de texto.
im.hint.steer=Para añadir o ajustar la tarea actual, envía /steer <texto>
im.hint.interrupt=Para detener la tarea actual, envía /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Entendido, añadido como tarea nueva. Hay {1} tarea(s) delante; será tu turno cuando terminen. {0}
im.queued.immediate=Entendido, añadido como tarea nueva. Comenzará cuando termine la tarea actual. {0}
