# رسائل SolonCode الفورية (العربية)
im.accepted=حسنًا، سأبدأ المعالجة فورًا
im.longRunning=ما زلت أعمل على ذلك، يرجى الانتظار قليلًا
im.rejected=لم تتم إضافة هذه الرسالة إلى قائمة الانتظار، لذلك لم أستلمها. يرجى إرسالها مرة أخرى لاحقًا. لإيقاف المهمة الحالية أرسل /interrupt
im.hint.unbound=لا توجد جلسة مرتبطة بعد. امسح رمز QR في صفحة الويب لربط الجلسة والدردشة هنا
im.hint.botTaken=هذا الروبوت مرتبط بالفعل بمحادثة أخرى. لربطه بهذه المحادثة، يُرجى إلغاء الربط أولاً في صفحة الويب ثم مسح رمز QR مرة أخرى.
im.hint.nonText=لا أستطيع قراءة سوى النص حاليًا. أرسل رسالة نصية من فضلك
im.hint.steer=لإضافة معلومات أو تعديل المهمة الحالية أرسل /steer <النص>
im.hint.interrupt=لإيقاف المهمة الحالية أرسل /interrupt
im.hint.busyCommand={0}؛ {1}
im.queued.behind=حسنًا، أُضيفت رسالتك كمهمة جديدة. توجد {1} مهمة أمامك، وسيأتي دورك بعد انتهائها. {0}
im.queued.immediate=حسنًا، أُضيفت رسالتك كمهمة جديدة. ستبدأ بعد انتهاء المهمة الحالية. {0}
