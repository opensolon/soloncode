# Messaggi IM di SolonCode (italiano)
im.accepted=Ricevuto, inizio subito
im.longRunning=Sto ancora lavorando, attendi ancora un momento
im.rejected=Questo messaggio non è stato messo in coda e non l'ho ricevuto. Invialo di nuovo più tardi. Per fermare l'attività corrente, invia /interrupt
im.hint.unbound=Non è ancora collegata alcuna sessione. Scansiona il codice QR nella pagina Web per collegarla e chattare qui.
im.hint.botTaken=Questo bot è già associato a un'altra conversazione. Per associarlo a questa, annulla prima l'associazione sul Web e scansiona di nuovo il codice QR.
im.hint.nonText=Al momento posso leggere solo testo. Inviami un messaggio di testo.
im.hint.steer=Per aggiungere o modificare l'attività corrente, invia /steer <testo>
im.hint.interrupt=Per fermare l'attività corrente, invia /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Ricevuto, aggiunto come nuova attività. Ci sono {1} attività davanti a te; sarà il tuo turno quando finiranno. {0}
im.queued.immediate=Ricevuto, aggiunto come nuova attività. Inizierà appena termina l'attività corrente. {0}
