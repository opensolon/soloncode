# SolonCode IM メッセージ（日本語）
im.accepted=了解しました。すぐに開始します
im.longRunning=まだ処理中です。もう少しお待ちください
im.rejected=このメッセージはキューに追加されず、受信できませんでした。後でもう一度送信してください。現在のタスクを停止するには /interrupt を送信してください
im.hint.unbound=まだセッションが接続されていません。Web ページで QR コードをスキャンして接続すると、ここでチャットできます
im.hint.botTaken=このボットはすでに別の対話にバインドされています。この対話に接続するには、まず Web 側でバインドを解除し、もう一度 QR コードを読み取ってください。
im.hint.nonText=現在はテキストしか読めません。テキストメッセージを送信してください
im.hint.steer=現在のタスクを補足・調整するには /steer <テキスト> を送信してください
im.steered=了解しました。現在のタスクに割り込みました。この返信に反映されます。
im.hint.interrupt=現在のタスクを停止するには /interrupt を送信してください
im.hint.busyCommand={0}；{1}
im.queued.behind=了解しました。新しいタスクとしてキューに追加しました。あなたの前に {1} 件あります。完了後に処理します。{0}
im.queued.immediate=了解しました。新しいタスクとしてキューに追加しました。現在のタスクが完了すると開始します。{0}
