# SolonCode IM 交互文案（默认语言：简体中文）
#
# 无后缀文件即「默认语言」，是所有未覆盖地区的兜底，与前端 i18n 的
# DEFAULT_LOCALE = zh-CN 保持一致；其它语言以 im-messages_<lang>.properties 覆盖
# （见 im-messages_en.properties）。
#
# 占位符使用 MessageFormat 语法（{0}/{1}）。MessageFormat 把单引号当作转义符，
# 文案中若出现英文撇号必须写成两个单引号（''），建议直接避开撇号。
#
# 键与 ImMessages 中的常量一一对应，增删改请同步 ImMessages.FALLBACK。

# 空闲受理成功
im.accepted=收到，马上开始处理

# 长任务心跳
im.longRunning=还在处理中，请再稍等一下

# 入队失败（队列满等）：此时唯一能自救的是中断当前任务，故直接给出命令
im.rejected=还有任务没忙完，暂时接不了新的。想立刻处理，可发送 /interrupt 中断当前任务

# 未绑定用户引导
im.hint.unbound=还没有绑定会话，请先在 Web 端扫码绑定，然后我就能陪你聊了。

# 非文本消息回执
im.hint.nonText=我暂时只看得懂文字，换文字发给我吧。

# 忙态插话引导（IM 缺插话途径，/steer 是其补位）
im.hint.steer=想补充或调整当前任务，可发送 /steer <内容>

# 忙态中断引导
im.hint.interrupt=想中断当前任务，可发送 /interrupt

# 忙态命令引导组合：{0}=插话引导，{1}=中断引导
# 刻意不引导 /queue：IM 忙态直发消息即自动排队，再教一个显式排队命令，
# 反而会让用户以为「不敲命令消息就会丢」。
im.hint.busyCommand={0}；{1}

# 入队回执：{0}=命令引导（可为空串），{1}=前面待执行条数
im.queued.behind=收到，已作为新任务排队，前面还有 {1} 条，处理完就轮到你。{0}

# 入队回执（前面没人，马上轮到）
im.queued.immediate=收到，已作为新任务排队，马上轮到你了。{0}
