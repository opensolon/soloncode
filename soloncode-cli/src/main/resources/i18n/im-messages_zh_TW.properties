# SolonCode IM 互動訊息（繁體中文）
im.accepted=收到，馬上開始處理
im.longRunning=還在處理中，請再稍等一下
im.rejected=這則訊息沒有排入佇列，我尚未收到，稍後請再傳送一次。若要先中斷目前工作，請傳送 /interrupt
im.hint.unbound=尚未綁定對話，請先在 Web 端掃描 QR Code 完成綁定，之後就能在這裡和我聊天
im.hint.botTaken=這個機器人已經綁定到其他對話了。想接到目前這個對話，請先在 Web 端解綁，再重新掃描 QR Code 綁定。
im.hint.nonText=我目前只能看懂文字，請改傳文字訊息
im.hint.steer=想補充或調整目前工作，可以傳送 /steer <內容>
im.steered=收到，已插話到目前任務，會體現在這一輪的回覆裡
im.hint.interrupt=想中斷目前工作，可以傳送 /interrupt
im.hint.busyCommand={0}；{1}
im.queued.behind=收到，已作為新工作排入佇列，前面還有 {1} 項，處理完就輪到你。{0}
im.queued.immediate=收到，已作為新工作排入佇列，目前工作完成後就輪到你。{0}
