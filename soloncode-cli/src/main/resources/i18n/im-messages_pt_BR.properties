# Mensagens IM do SolonCode (português do Brasil)
im.accepted=Entendido, vou começar agora
im.longRunning=Ainda estou trabalhando nisso, aguarde mais um pouco
im.rejected=Esta mensagem não entrou na fila e eu não a recebi. Envie-a novamente mais tarde. Para interromper a tarefa atual, envie /interrupt
im.hint.unbound=Nenhuma sessão está vinculada. Escaneie o QR code na página Web para vincular e conversar comigo aqui.
im.hint.nonText=Por enquanto, só consigo ler texto. Envie uma mensagem de texto.
im.hint.steer=Para complementar ou ajustar a tarefa atual, envie /steer <texto>
im.hint.interrupt=Para interromper a tarefa atual, envie /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Entendido, adicionado como uma nova tarefa. Há {1} tarefa(s) à sua frente; será sua vez quando terminarem. {0}
im.queued.immediate=Entendido, adicionado como uma nova tarefa. Ela começará assim que a tarefa atual terminar. {0}
