# SolonCode IM messages (English)
#
# Overrides the default bundle (Simplified Chinese) when the resolved locale is English.
#
# Placeholders use MessageFormat syntax ({0}/{1}). MessageFormat treats the single quote
# as an escape character, so avoid apostrophes in these values.

# Idle session accepted
im.accepted=Got it, starting right away

# Long-running heartbeat
im.longRunning=Still working on it, please hold on a little longer

# Enqueue failed (queue full etc.): make it clear the message was not received and should be sent
# again later; the only way out is to stop the current task
im.rejected=This message was not queued, so I did not receive it. Please send it again later. To stop the current task, send /interrupt

# Unbound user hint
im.hint.unbound=No session is bound yet. Please scan the QR code on the Web page to bind, then you can chat with me here.

# Non-text message hint
im.hint.nonText=I can only read text for now. Please send it as a text message.

# Busy-state steer hint
im.hint.steer=To add to or adjust the current task, send /steer <text>

# Busy-state interrupt hint
im.hint.interrupt=To stop the current task, send /interrupt

# Busy-state command hint: {0}=steer hint, {1}=interrupt hint
im.hint.busyCommand={0}; {1}

# Queued: {0}=command hint (may be empty), {1}=number of tasks ahead
im.queued.behind=Got it, queued as a new task. {1} ahead of you, and it will be your turn once they are done. {0}

# Queued and up next (starts after the current task finishes)
im.queued.immediate=Got it, queued as a new task. It will start as soon as the current task finishes. {0}
