# SolonCode IM 메시지 (한국어)
im.accepted=알겠습니다. 바로 시작할게요
im.longRunning=아직 처리 중입니다. 조금만 더 기다려 주세요
im.rejected=이 메시지는 대기열에 추가되지 않아 받지 못했습니다. 나중에 다시 보내 주세요. 현재 작업을 중단하려면 /interrupt 를 보내세요
im.hint.unbound=아직 연결된 세션이 없습니다. 웹 페이지에서 QR 코드를 스캔해 연결하면 여기서 대화할 수 있습니다
im.hint.nonText=현재는 텍스트만 읽을 수 있습니다. 텍스트 메시지를 보내 주세요
im.hint.steer=현재 작업을 보완하거나 조정하려면 /steer <내용> 을 보내세요
im.hint.interrupt=현재 작업을 중단하려면 /interrupt 를 보내세요
im.hint.busyCommand={0}; {1}
im.queued.behind=알겠습니다. 새 작업으로 대기열에 추가했습니다. 앞에 {1}개의 작업이 있으며 완료되면 차례가 됩니다. {0}
im.queued.immediate=알겠습니다. 새 작업으로 대기열에 추가했습니다. 현재 작업이 끝나면 시작합니다. {0}
