# Повідомлення SolonCode IM (українська)
im.accepted=Зрозуміло, починаю просто зараз
im.longRunning=Я все ще працюю над цим, зачекайте ще трохи
im.rejected=Це повідомлення не потрапило в чергу, тому я його не отримав. Надішліть його ще раз пізніше. Щоб зупинити поточне завдання, надішліть /interrupt
im.hint.unbound=Сесію ще не прив’язано. Відскануйте QR-код на вебсторінці, щоб прив’язати її та спілкуватися тут
im.hint.botTaken=Цей бот уже прив'язано до іншої розмови. Щоб прив'язати його до поточної, спочатку відв'яжіть його у вебінтерфейсі, а потім відскануйте QR-код знову.
im.hint.nonText=Наразі я можу читати лише текст. Надішліть текстове повідомлення
im.hint.steer=Щоб доповнити або змінити поточне завдання, надішліть /steer <текст>
im.steered=Зрозуміло, додав до поточного завдання. Це відобразиться в цій відповіді.
im.hint.interrupt=Щоб зупинити поточне завдання, надішліть /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Зрозуміло, додано як нове завдання. Перед вами ще {1} завдань; я перейду до вашого після їх завершення. {0}
im.queued.immediate=Зрозуміло, додано як нове завдання. Воно почнеться після завершення поточного завдання. {0}
