# SolonCode IM-berichten (Nederlands)
im.accepted=Begrepen, ik begin meteen
im.longRunning=Ik ben er nog mee bezig, wacht nog even
im.rejected=Dit bericht is niet in de wachtrij geplaatst en is niet ontvangen. Stuur het later opnieuw. Stuur /interrupt om de huidige taak te stoppen
im.hint.unbound=Er is nog geen sessie gekoppeld. Scan de QR-code op de webpagina om te koppelen en hier te chatten
im.hint.botTaken=Deze bot is al aan een ander gesprek gekoppeld. Om hem aan dit gesprek te koppelen, ontkoppelt u hem eerst op de webpagina en scant u daarna de QR-code opnieuw.
im.hint.nonText=Ik kan momenteel alleen tekst lezen. Stuur een tekstbericht
im.hint.steer=Stuur /steer <tekst> om de huidige taak aan te vullen of aan te passen
im.steered=Begrepen, toegevoegd aan de huidige taak. Het komt terug in dit antwoord.
im.hint.interrupt=Stuur /interrupt om de huidige taak te stoppen
im.hint.busyCommand={0}; {1}
im.queued.behind=Begrepen, toegevoegd als nieuwe taak. Er staan nog {1} taak/taken voor je; daarna ben jij aan de beurt. {0}
im.queued.immediate=Begrepen, toegevoegd als nieuwe taak. De taak start zodra de huidige taak klaar is. {0}
