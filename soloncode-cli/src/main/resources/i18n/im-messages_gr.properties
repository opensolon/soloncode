# SolonCode IM μηνύματα (Ελληνικά)
im.accepted=Εντάξει, ξεκινάω αμέσως
im.longRunning=Επεξεργάζομαι ακόμη το αίτημά σας, περιμένετε λίγο
im.rejected=Αυτό το μήνυμα δεν μπήκε στην ουρά και δεν το έλαβα. Στείλτε το ξανά αργότερα. Για διακοπή της τρέχουσας εργασίας στείλτε /interrupt
im.hint.unbound=Δεν έχει συνδεθεί ακόμη κάποια συνεδρία. Σαρώστε τον κωδικό QR στη σελίδα Web για σύνδεση και συνομιλία εδώ
im.hint.botTaken=Αυτό το bot είναι ήδη συνδεδεμένο με άλλη συνομιλία. Για να το συνδέσετε σε αυτήν, αποσυνδέστε το πρώτα στη σελίδα Web και έπειτα σαρώστε ξανά τον κωδικό QR.
im.hint.nonText=Προς το παρόν μπορώ να διαβάσω μόνο κείμενο. Στείλτε ένα μήνυμα κειμένου
im.hint.steer=Για προσθήκη ή调整 της τρέχουσας εργασίας στείλτε /steer <κείμενο>
im.steered=Εντάξει, το πρόσθεσα στην τρέχουσα εργασία. Θα εμφανιστεί σε αυτή την απάντηση.
im.hint.interrupt=Για διακοπή της τρέχουσας εργασίας στείλτε /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Εντάξει, προστέθηκε ως νέα εργασία. Υπάρχουν {1} εργασίες πριν από τη δική σας· θα έρθει η σειρά σας όταν ολοκληρωθούν. {0}
im.queued.immediate=Εντάξει, προστέθηκε ως νέα εργασία. Θα ξεκινήσει μόλις ολοκληρωθεί η τρέχουσα εργασία. {0}
