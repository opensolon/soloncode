# Messages IM SolonCode (français)
im.accepted=Compris, je commence tout de suite
im.longRunning=Je travaille encore dessus, veuillez patienter un peu
im.rejected=Ce message n'a pas été mis en file et je ne l'ai pas reçu. Veuillez le renvoyer plus tard. Pour arrêter la tâche actuelle, envoyez /interrupt
im.hint.unbound=Aucune session n''est encore liée. Scannez le QR code sur la page Web pour la lier et discuter ici.
im.hint.botTaken=Ce bot est déjà lié à une autre conversation. Pour le lier à celle-ci, dissociez-le d'abord dans le Web, puis scannez à nouveau le code QR.
im.hint.nonText=Je ne peux lire que du texte pour le moment. Envoyez-moi un message texte.
im.hint.steer=Pour compléter ou modifier la tâche actuelle, envoyez /steer <texte>
im.steered=Compris, ajouté à la tâche en cours. Cela apparaîtra dans cette réponse.
im.hint.interrupt=Pour arrêter la tâche actuelle, envoyez /interrupt
im.hint.busyCommand={0} ; {1}
im.queued.behind=Compris, ajouté comme nouvelle tâche. {1} tâche(s) vous précèdent et ce sera votre tour lorsqu''elles seront terminées. {0}
im.queued.immediate=Compris, ajouté comme nouvelle tâche. Elle démarrera dès que la tâche actuelle sera terminée. {0}
