# Wiadomości IM SolonCode (polski)
im.accepted=Rozumiem, zaczynam od razu
im.longRunning=Nadal nad tym pracuję, proszę jeszcze chwilę poczekać
im.rejected=Ta wiadomość nie trafiła do kolejki, więc jej nie otrzymałem. Wyślij ją ponownie później. Aby zatrzymać bieżące zadanie, wyślij /interrupt
im.hint.unbound=Nie ma jeszcze powiązanej sesji. Zeskanuj kod QR na stronie WWW, aby ją powiązać i rozmawiać tutaj
im.hint.botTaken=Ten bot jest już powiązany z inną rozmową. Aby powiązać go z tą, najpierw usuń powiązanie w przeglądarce, a następnie ponownie zeskanuj kod QR.
im.hint.nonText=Na razie mogę czytać tylko tekst. Wyślij wiadomość tekstową
im.hint.steer=Aby uzupełnić lub zmienić bieżące zadanie, wyślij /steer <tekst>
im.steered=Rozumiem, dodałem do bieżącego zadania. Pojawi się w tej odpowiedzi.
im.hint.interrupt=Aby zatrzymać bieżące zadanie, wyślij /interrupt
im.hint.busyCommand={0}; {1}
im.queued.behind=Rozumiem, dodano jako nowe zadanie. Przed Tobą jest jeszcze {1} zadań; zajmę się Twoim po ich zakończeniu. {0}
im.queued.immediate=Rozumiem, dodano jako nowe zadanie. Rozpocznie się po zakończeniu bieżącego zadania. {0}
