# SolonCode IM-beskeder (dansk)
im.accepted=Forstået, jeg går i gang med det samme
im.longRunning=Jeg arbejder stadig på det, vent venligst lidt endnu
im.rejected=Denne besked blev ikke sat i kø, så jeg modtog den ikke. Send den igen senere. Send /interrupt for at stoppe den aktuelle opgave
im.hint.unbound=Ingen session er knyttet endnu. Scan QR-koden på websiden for at knytte den og chatte her
im.hint.botTaken=Denne bot er allerede knyttet til en anden samtale. For at knytte den til denne skal du først fjerne tilknytningen på websiden og derefter scanne QR-koden igen.
im.hint.nonText=Jeg kan kun læse tekst lige nu. Send en tekstbesked
im.hint.steer=Send /steer <tekst> for at tilføje til eller ændre den aktuelle opgave
im.steered=Forstået, tilføjet til den aktuelle opgave. Det vises i dette svar.
im.hint.interrupt=Send /interrupt for at stoppe den aktuelle opgave
im.hint.busyCommand={0}; {1}
im.queued.behind=Forstået, sat i kø som en ny opgave. {1} opgave(r) foran dig; det bliver din tur, når de er færdige. {0}
im.queued.immediate=Forstået, sat i kø som en ny opgave. Den starter, når den aktuelle opgave er færdig. {0}
