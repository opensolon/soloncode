<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>管理控制台 - SolonCode</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="shortcut icon" type="image/x-icon" href="/img/favicon.png"/>
    <link rel="icon" sizes="any" type="image/x-icon" href="/img/favicon.png"/>
    <link rel="stylesheet" href="/layui/css/layui.css"/>
    <link rel="stylesheet" href="/css/theme.css"/>
    <link rel="stylesheet" href="/css/settings.css"/>
    <link rel="stylesheet" href="/css/admin.css"/>
    <script>window._i18nVer = '20260802';</script>
    <!-- 界面状态（后端记忆）：必须先于 i18n.js 加载，localStorage 只做首屏镜像 -->
    <script src="/js/ui-state.js"></script>
    <script src="/js/i18n.js"></script>
    <link rel="stylesheet" id="skinStyle" href="/skin/default/skin.css"/>
</head>
<body class="admin-body" data-theme="light">
    <script>
        // 与 web.html 一致：主题变量仅定义在 [data-theme] 下，未设则全部变量为空、
        // 导致边框/背景失效。在渲染前尽早应用主题、避免闪白。
        // 主题的真相源是服务端（/web/ui/state），本地缓存换端口即丢，故水合后再校准一次。
        (function () {
            function applyAdminTheme() {
                try {
                    var t = window.UiState ? UiState.get('chat-theme', 'light') : 'light';
                    document.body.setAttribute('data-theme', t);
                } catch (e) { /* 读取失败时保留当前主题 */ }
            }
            applyAdminTheme();
            //门面已水合时会立即执行（见 js/ui-state.js）
            UiState.ready(applyAdminTheme);
        })();
    </script>
    <div class="admin-topbar">
        <img src="/img/favicon.png" alt="SolonCode" class="admin-topbar-logo"/>
        <span class="admin-topbar-title">SolonCode 管理控制台 (Beta)</span><span class="admin-topbar-status" id="adminSecurityStatus" aria-live="polite"></span>
        <div class="admin-topbar-spacer"></div>
        <div class="admin-topbar-actions">
            <div class="admin-user-menu" id="adminUserMenu">
                <button type="button" class="admin-user-menu-btn" id="adminUserMenuBtn" title="用户" aria-label="用户" aria-haspopup="menu" aria-expanded="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="admin-user-menu-dropdown" id="adminUserMenuDropdown" role="menu">
                    <div class="sidebar-user-profile">
                        <div class="sidebar-user-avatar" id="adminUserAvatar" aria-hidden="true"></div>
                        <div class="sidebar-user-identity">
                            <div class="sidebar-user-display-name" id="adminUserDisplayName"></div>
                            <div class="sidebar-user-username" id="adminUserUsername"></div>
                        </div>
                    </div>
                    <div class="sidebar-user-menu-separator"></div>
                    <a class="admin-user-menu-item" href="/" role="menuitem">返回工作台</a>
                    <button type="button" class="admin-user-menu-item danger" id="adminLogoutBtn" role="menuitem">退出登录</button>
                </div>
            </div>
        </div>
    </div>
    <div class="admin-main">
        <nav class="admin-nav" id="adminNav"></nav>
        <div class="admin-content" id="adminContent"></div>
    </div>

    <script src="/layui/layui.js"></script>
    <script>window.$ = layui.$;</script>
    <script>
        // admin-auth-users.js 所需的最小全局依赖（避免引入 app-base.js 对 web.html DOM 的耦合）
        var SVG_TRASH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
        window.showToast = function (msg, type) {
            if (typeof layer !== 'undefined' && layer.msg) {
                layer.msg(msg, { icon: type === 'error' ? 2 : 1, time: 2500, offset: '120px' });
            } else {
                alert(msg);
            }
        };
    </script>
    <script src="/js/app-settings-profile.js"></script>
    <script src="/js/admin-auth-users.js"></script>
    <script src="/js/admin-modules.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
