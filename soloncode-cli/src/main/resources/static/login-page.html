<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>登录 - SolonCode</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="shortcut icon" type="image/x-icon" href="/img/favicon.png"/>
    <link rel="icon" sizes="any" type="image/x-icon" href="/img/favicon.png"/>
    <link rel="stylesheet" href="/layui/css/layui.css"/>
    <link rel="stylesheet" href="/css/theme.css"/>
    <link rel="stylesheet" href="/css/login.css"/>
    <script>window._i18nVer = '20260802';</script>
    <!-- 界面状态（后端记忆）：必须先于 i18n.js 加载，localStorage 只做首屏镜像 -->
    <script src="/js/ui-state.js"></script>
    <script src="/js/i18n.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-form">
                <div class="login-field">
                    <label class="login-label" for="loginUsername" data-i18n="login.username">用户名</label>
                    <input type="text" id="loginUsername" class="login-input" placeholder="请输入用户名" autocomplete="username" autofocus/>
                </div>
                <div class="login-field">
                    <label class="login-label" for="loginPassword" data-i18n="login.password">密码</label>
                    <input type="password" id="loginPassword" class="login-input" placeholder="请输入密码" autocomplete="current-password"/>
                </div>
                <div class="login-error" id="loginError" style="display:none"></div>
                <button type="button" class="login-btn" id="loginBtn" data-i18n="login.loginBtn">登 录</button>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var query = new URLSearchParams(window.location.search);
            var returnUrl = query.get('returnUrl');
            function safeReturnUrl(value) {
                if (!value || value.charAt(0) !== '/' || value.indexOf('//') === 0 || value.indexOf('\\') >= 0) return null;
                try {
                    var parsed = new URL(value, window.location.origin);
                    if (parsed.origin !== window.location.origin) return null;
                    return parsed.pathname + parsed.search + parsed.hash;
                } catch (e) { return null; }
            }
            // 只有调用方明确传入合法 returnUrl 时才回到指定页面；直接访问管理登录页默认进入工作台。
            var safeTarget = safeReturnUrl(returnUrl) || '/';
            var loginEndpoint = '/web/login';
            var loginBtn = document.getElementById('loginBtn');
            var usernameInput = document.getElementById('loginUsername');
            var passwordInput = document.getElementById('loginPassword');
            var errorDiv = document.getElementById('loginError');
            
            function showError(msg) {
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
            }
            
            function hideError() {
                errorDiv.style.display = 'none';
            }
            
            function doLogin() {
                var username = usernameInput.value.trim();
                var password = passwordInput.value;
                
                if (!username) { showError('请输入用户名'); return; }
                if (!password) { showError('请输入密码'); return; }
                
                hideError();
                loginBtn.disabled = true;
                loginBtn.textContent = '登录中...';
                
                fetch(loginEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'username=' + encodeURIComponent(username) + '&password=' + encodeURIComponent(password)
                })
                .then(function(r) { return r.json(); })
                .then(function(resp) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登 录';
                    if (resp.code === 200 && resp.data) {
                        // 统一登录接口由服务端签发 HttpOnly Cookie；token 仅供非浏览器客户端兼容使用。
                        // 无论登录账号是否为管理员，未显式指定目标时都进入工作台。
                        window.location.replace(safeTarget);
                    } else {
                        showError(resp.description || '登录失败，请检查用户名和密码');
                    }
                })
                .catch(function() {
                    loginBtn.disabled = false;
                    loginBtn.textContent = '登 录';
                    showError('网络错误，请稍后重试');
                });
            }
            
            loginBtn.addEventListener('click', doLogin);
            passwordInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doLogin();
            });
            usernameInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') passwordInput.focus();
            });
        })();
    </script>
</body>
</html>
